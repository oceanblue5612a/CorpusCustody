[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corpuscustody"
version = "1.0.1"
description = "Training-data license and provenance gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "the corpuscustody authors" }]

[project.scripts]
corpuscustody = "corpuscustody.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

